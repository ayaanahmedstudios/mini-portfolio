<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaan Ahmed — Photography</title>
    <link rel="icon" type="image/svg+xml" href="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="header-content">
        <!-- H1 leads home on inner pages -->
        <h1><a href="index.html">Ayaan Ahmed</a></h1>
        <p class="mono-subtitle">Graphic Designer & Photographer</p>
    </div>
    
    <nav class="site-nav">
        <a href="index.html">Graphic Design</a>
        <a href="photography.html" class="active mobile-hide">Photography</a>
        <a href="videography.html">Videography</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main>
    <div class="search-container">
        <div class="project-search-input" style="cursor: default;">Photography Archive</div>
    </div>

    <!-- Pure CSS Masonry Gallery - Native Aspect Ratios -->
    <div class="photo-masonry">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/f_auto,q_auto/v1767392034/AyaanAhmed_Tokyo_Disneyland_001_qs4vhp.webp" alt="Tokyo Disneyland" loading="lazy">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/f_auto,q_auto/v1767392034/AyaanAhmed_Tokyo_Disneyland_001_qs4vhp.webp" alt="Tokyo Disneyland" loading="lazy">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/f_auto,q_auto/v1767392034/AyaanAhmed_Tokyo_Disneyland_001_qs4vhp.webp" alt="Tokyo Disneyland" loading="lazy">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/f_auto,q_auto/v1767392034/AyaanAhmed_Tokyo_Disneyland_001_qs4vhp.webp" alt="Tokyo Disneyland" loading="lazy">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/f_auto,q_auto/v1767392034/AyaanAhmed_Tokyo_Disneyland_001_qs4vhp.webp" alt="Tokyo Disneyland" loading="lazy">
        <!-- Easily add more raw img tags here, the grid handles the rest automatically -->
    </div>
</main>

<footer class="site-footer">
    <div class="footer-left">
        <div class="footer-logo-mobile">
            <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed Logo" class="raw-logo">
        </div>
        <div class="footer-copyright">
            <span class="mono-text">© <span class="year"></span> Ayaan Ahmed Studios</span>
        </div>
    </div>
    
    <div class="footer-center">
        <img src="media/Student-RGD-Black.svg" alt="Student RGD Logo" class="rgd-logo">
    </div>

    <div class="footer-links">
        <a href="https://www.linkedin.com/in/ayaanahmedstudios" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a>
        <a href="https://instagram.com/bluetigerincstudios" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a>
        <button id="copy-email-btn" aria-label="Copy Email"><span class="btn-content"><i class="ph ph-envelope-simple"></i></span></button>
    </div>
</footer>

<script>
document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());

const emailBtn = document.getElementById('copy-email-btn');
const btnContent = emailBtn.querySelector('.btn-content');
emailBtn.addEventListener('click', () => {
    navigator.clipboard.writeText('ayaanahmedstudios@gmail.com');
    btnContent.innerHTML = 'Email copied';
    btnContent.classList.add('copied-state');
    setTimeout(() => {
        btnContent.innerHTML = '<i class="ph ph-envelope-simple"></i>';
        btnContent.classList.remove('copied-state');
    }, 2000);
});
</script>
</body>
</html>
